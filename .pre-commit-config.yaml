repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # VS Code writes settings.json without a final newline; don't fight it
        exclude: ^vscode/Library/Application Support/Code/User/settings\.json$
      - id: trailing-whitespace
